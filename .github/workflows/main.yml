on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  send-emails:
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Go version
        run: go version

      - name: Build
        run: go build -o eraser.exe ./cmd/eraser

      - name: Send emails
        run: eraser.exe send
