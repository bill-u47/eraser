name: Monthly email sender

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
  push:
    branches:
      - main

defaults:
  run:
    shell: cmd

jobs:
  send-emails:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure config directory exists
        run: |
          if exist "%USERPROFILE%\.eraser" rmdir /s /q "%USERPROFILE%\.eraser"
          mkdir "%USERPROFILE%\.eraser"

      - name: Write config
        run: |
          > %USERPROFILE%\.eraser\config.yaml (
            echo profile:
            echo   first_name: "%ERASER_FIRST_NAME%"
            echo   last_name: "%ERASER_LAST_NAME%"
            echo   email: "%ERASER_EMAIL%"
            echo   address: "%ERASER_ADDRESS%"
            echo   city: "%ERASER_CITY%"
            echo   state: "%ERASER_STATE%"
            echo   zip_code: "%ERASER_ZIP_CODE%"
            echo   country: "%ERASER_COUNTRY%"
            echo   phone: "%ERASER_PHONE%"
            echo email:
            echo   provider: "%ERASER_EMAIL_PROVIDER%"
            echo   from: "%ERASER_EMAIL%"
            echo   smtp:
            echo     host: "%ERASER_SMTP_HOST%"
            echo     port: %ERASER_SMTP_PORT%
            echo     username: "%ERASER_SMTP_USERNAME%"
            echo     password: "%ERASER_SMTP_PASSWORD%"
            echo     use_tls: true
            echo options:
            echo   template: "%ERASER_TEMPLATE%"
          )
        env:
          ERASER_FIRST_NAME: ${{ secrets.ERASER_FIRST_NAME }}
          ERASER_LAST_NAME: ${{ secrets.ERASER_LAST_NAME }}
          ERASER_EMAIL: ${{ secrets.ERASER_EMAIL }}
          ERASER_ADDRESS: ${{ secrets.ERASER_ADDRESS }}
          ERASER_CITY: ${{ secrets.ERASER_CITY }}
          ERASER_STATE: ${{ secrets.ERASER_STATE }}
          ERASER_ZIP_CODE: ${{ secrets.ERASER_ZIP_CODE }}
          ERASER_COUNTRY: ${{ secrets.ERASER_COUNTRY }}
          ERASER_PHONE: ${{ secrets.ERASER_PHONE }}
          ERASER_EMAIL_PROVIDER: ${{ secrets.ERASER_EMAIL_PROVIDER }}
          ERASER_SMTP_HOST: ${{ secrets.ERASER_SMTP_HOST }}
          ERASER_SMTP_PORT: ${{ secrets.ERASER_SMTP_PORT }}
          ERASER_SMTP_USERNAME: ${{ secrets.ERASER_SMTP_USERNAME }}
          ERASER_SMTP_PASSWORD: ${{ secrets.ERASER_SMTP_PASSWORD }}
          ERASER_TEMPLATE: ${{ secrets.ERASER_TEMPLATE }}

      - name: Set up Go (optional but recommended)
        uses: actions/setup-go@v4
        with:
          go-version: '1.21' # change to the Go version your project requires

      - name: Build
        run: go build -o eraser.exe ./cmd/eraser

      - name: Send emails
        run: eraser.exe send
